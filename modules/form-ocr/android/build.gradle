plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.formocr'
version = '1.0.0'

android {
  namespace "expo.modules.formocr"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // On-device text recognition, Latin script. The model ships inside the app (no download, works offline).
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
